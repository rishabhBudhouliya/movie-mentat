# Local Postgres for development and tests. Neon is used only in deployment.
services:
  postgres:
    # Pinned by digest (supply-chain policy, PLAN.md). Tag: 18-alpine, matching Neon (18.x).
    image: postgres@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
    environment:
      POSTGRES_USER: mentat
      POSTGRES_PASSWORD: mentat
      POSTGRES_DB: movie_mentat
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentat -d movie_mentat"]
      interval: 2s
      timeout: 2s
      retries: 15
