# Supply-chain policy (PLAN.md, "Dependencies").

# Refuse versions published less than 72 hours ago (in minutes).
minimumReleaseAge: 4320

# Fail if a package's publishing trust level drops (e.g. trusted publishing -> token).
trustPolicy: no-downgrade

# Exact versions, no ^ or ~.
saveExact: true

# Pnpm defaults, written out so the policy is visible in one place.
strictDepBuilds: true
blockExoticSubdeps: true

# Reviewed install scripts that we deliberately do NOT run:
# - prisma: preinstall is only a Node version check.
# - @prisma/engines: postinstall downloads the schema engine; the CLI fetches it
#   on first use instead (verified with `prisma migrate` before relying on it).
ignoredBuiltDependencies:
  - prisma
  - "@prisma/engines"
